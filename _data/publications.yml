    and Meiyuwang Zhang and Ruyi Ji and Xuechang Tu and Zihan Zheng and Zexing Chen
    and Kangyang Zhou and Zhaozi Wang and Jingbang Chen and Aleksandra Korolova and
    Peter Henderson and Pramod Viswanath and Vijay Ganesh and Saining Xie and Zhuang
    Liu and Dawn Song and Sewon Min and Ion Stoica and Joseph E Gonzalez and Jingbo
    Shang and Alvin Cheung
  venue: arXiv preprint arXiv:2512.15699
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:unp9ATQDT5gC
  abstract: We introduce FrontierCS, a benchmark of 156 open-ended problems across
    diverse areas of computer science, designed and reviewed by experts, including
    CS PhDs and top-tier competitive programming participants and problem setters.
    Unlike existing benchmarks that focus on tasks with known optimal solutions, FrontierCS
    targets problems where the optimal solution is unknown, but the quality of a solution
    can be objectively evaluated. Models solve these tasks by implementing executable
    programs rather than outputting a direct answer. FrontierCS includes algorithmic
    problems, which are often NP-hard variants of competitive programming problems
    with objective partial scoring, and research problems with the same property.
    For each problem we provide an expert reference solution and an automatic evaluator.
    Combining open-ended design, measurable progress, and expert curation, FrontierCS
    provides a benchmark at the frontier of computer-science difficulty. Empirically,
    we find that frontier reasoning models still lag far behind human experts on both
    the algorithmic and research tracks, that increasing reasoning budgets alone does
    not close this gap, and that models often over-optimize for generating merely
    workable code instead of discovering high-quality algorithms and system designs.
