- title: Adaptive Semantic Prompt Caching with VectorQ
  authors: Luis Gaspar Schroeder and Shu Liu and Alejandro Cuadron and Mark Zhao and
    Stephan Krusche and Alfons Kemper and Matei Zaharia and Joseph E Gonzalez
  venue: arXiv e-prints
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:WAzi4Gm8nLoC
  abstract: Semantic prompt caches reduce the latency and cost of large language model
    (LLM) inference by reusing cached LLM-generated responses for semantically similar
    prompts. Vector similarity metrics assign a numerical score to quantify the similarity
    between an embedded prompt and its nearest neighbor in the cache. Existing systems
    rely on a static threshold to classify whether the similarity score is sufficiently
    high to result in a cache hit. We show that this one-size-fits-all threshold is
    insufficient across different prompts. We propose VectorQ, a framework to learn
    embedding-specific threshold regions that adapt to the complexity and uncertainty
    of an embedding. Through evaluations on a combination of four diverse datasets,
    we show that VectorQ consistently outperforms state-of-the-art systems across
    all static thresholds, achieving up to 12x increases in cache hit rate and error
    rate reductions up to 92%.
  bib_id: B96GkdgAAAAJ:WAzi4Gm8nLoC
- title: Why do multi-agent llm systems fail?
  authors: Mert Cemri and Melissa Z Pan and Shuyi Yang and Lakshya A Agrawal and Bhavya
    Chopra and Rishabh Tiwari and Kurt Keutzer and Aditya Parameswaran and Dan Klein
    and Kannan Ramchandran and Matei Zaharia and Joseph E Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2503.13657
  year: 2025
  citations: 162
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:69ZgNCALVd0C
  abstract: Despite growing enthusiasm for Multi-Agent LLM Systems (MAS), their performance
    gains on popular benchmarks often remain minimal compared with single-agent frameworks.
    This gap highlights the need to systematically analyze the challenges hindering
    MAS effectiveness. We present MAST (Multi-Agent System Failure Taxonomy), the
    first empirically grounded taxonomy designed to understand MAS failures. We analyze
    seven popular MAS frameworks across over 200 tasks, involving six expert human
    annotators. Through this process, we identify 14 unique failure modes, organized
    into 3 overarching categories, (i) specification issues, (ii) inter-agent misalignment,
    and (iii) task verification. MAST emerges iteratively from rigorous inter-annotator
    agreement studies, achieving a Cohen's Kappa score of 0.88. To support scalable
    evaluation, we develop a validated LLM-as-a-Judge pipeline integrated with MAST.
    We leverage two case studies to demonstrate MAST's practical utility in analyzing
    failures and guiding MAS development. Our findings reveal that identified failures
    require more complex solutions, highlighting a clear roadmap for future research.
    We open source our comprehensive dataset and LLM annotator to facilitate further
    development of MAS.
  bib_id: B96GkdgAAAAJ:69ZgNCALVd0C
- title: 'TurboDiffusion: Accelerating Video Diffusion Models by 100-200 Times'
  authors: Jintao Zhang and Kaiwen Zheng and Kai Jiang and Haoxu Wang and Ion Stoica
    and Joseph E Gonzalez and Jianfei Chen and Jun Zhu
  venue: arXiv preprint arXiv:2512.16093
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:EsEWqaRxkBgC
  abstract: 'We introduce TurboDiffusion, a video generation acceleration framework
    that can speed up end-to-end diffusion generation by 100-200x while maintaining
    video quality. TurboDiffusion mainly relies on several components for acceleration:
    (1) Attention acceleration: TurboDiffusion uses low-bit SageAttention and trainable
    Sparse-Linear Attention (SLA) to speed up attention computation. (2) Step distillation:
    TurboDiffusion adopts rCM for efficient step distillation. (3) W8A8 quantization:
    TurboDiffusion quantizes model parameters and activations to 8 bits to accelerate
    linear layers and compress the model. In addition, TurboDiffusion incorporates
    several other engineering optimizations. We conduct experiments on the Wan2.2-I2V-14B-720P,
    Wan2.1-T2V-1.3B-480P, Wan2.1-T2V-14B-720P, and Wan2.1-T2V-14B-480P models. Experimental
    results show that TurboDiffusion achieves 100-200x speedup for video generation
    even on a single RTX 5090 GPU, while maintaining comparable video quality. The
    GitHub repository, which includes model checkpoints and easy-to-use code, is available
    at https://github.com/thu-ml/TurboDiffusion.'
  bib_id: B96GkdgAAAAJ:EsEWqaRxkBgC
- title: LLMs Can Easily Learn to Reason from Demonstrations Structure, not content,
    is what matters!
  authors: Dacheng Li and Shiyi Cao and Tyler Griggs and Shu Liu and Xiangxi Mo and
    Eric Tang and Sumanth Hegde and Kourosh Hakhamaneshi and Shishir G Patil and Matei
    Zaharia and Joseph E Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2502.07374
  year: 2025
  citations: 66
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:5bg8sr1QxYwC
  abstract: Large reasoning models (LRMs) tackle complex reasoning problems by following
    long chain-of-thoughts (Long CoT) that incorporate reflection, backtracking, and
    self-validation. However, the training techniques and data requirements to elicit
    Long CoT remain poorly understood. In this work, we find that a Large Language
    model (LLM) can effectively learn Long CoT reasoning through data-efficient supervised
    fine-tuning (SFT) and parameter-efficient low-rank adaptation (LoRA). With just
    17k long CoT training samples, the Qwen2.5-32B-Instruct model achieves significant
    improvements on a wide range of math and coding benchmarks, including 56.7% (+40.0%)
    on AIME 2024 and 57.0% (+8.1%) on LiveCodeBench, competitive to the proprietary
    o1-preview model's score of 44.6% and 59.1%. More importantly, we find that the
    structure of Long CoT is critical to the learning process, whereas the content
    of individual reasoning steps has minimal impact. Perturbations affecting content,
    such as training on incorrect samples or removing reasoning keywords, have little
    impact on performance. In contrast, structural modifications that disrupt logical
    consistency in the Long CoT, such as shuffling or deleting reasoning steps, significantly
    degrade accuracy. For example, a model trained on Long CoT samples with incorrect
    answers still achieves only 3.2% lower accuracy compared to training with fully
    correct samples. These insights deepen our understanding of how to elicit reasoning
    capabilities in LLMs and highlight key considerations for efficiently training
    the next generation of reasoning models. This is the academic paper of our previous
    released …
  bib_id: B96GkdgAAAAJ:5bg8sr1QxYwC
- title: 'SLA: Beyond Sparsity in Diffusion Transformers via Fine-Tunable Sparse-Linear
    Attention'
  authors: Jintao Zhang and Haoxu Wang and Kai Jiang and Shuo Yang and Kaiwen Zheng
    and Haocheng Xi and Ziteng Wang and Hongzhou Zhu and Min Zhao and Ion Stoica and
    Joseph E Gonzalez and Jun Zhu and Jianfei Chen
  venue: arXiv preprint arXiv:2509.24006
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:RJOyoaXV5v8C
  abstract: 'In Diffusion Transformer (DiT) models, particularly for video generation,
    attention latency is a major bottleneck due to the long sequence length and the
    quadratic complexity. We find that attention weights can be separated into two
    parts: a small fraction of large weights with high rank and the remaining weights
    with very low rank. This naturally suggests applying sparse acceleration to the
    first part and low-rank acceleration to the second. Based on this finding, we
    propose SLA (Sparse-Linear Attention), a trainable attention method that fuses
    sparse and linear attention to accelerate diffusion models. SLA classifies attention
    weights into critical, marginal, and negligible categories, applying O(N^2) attention
    to critical weights, O(N) attention to marginal weights, and skipping negligible
    ones. SLA combines these computations into a single GPU kernel and supports both
    forward and backward passes. With only a few fine-tuning steps using SLA, DiT
    models achieve a 20x reduction in attention computation, resulting in significant
    acceleration without loss of generation quality. Experiments show that SLA reduces
    attention computation by 95% without degrading end-to-end generation quality,
    outperforming baseline methods. In addition, we implement an efficient GPU kernel
    for SLA, which yields a 13.7x speedup in attention computation and a 2.2x end-to-end
    speedup in video generation on Wan2.1-1.3B. The code is available at https://github.com/thu-ml/SLA.'
  bib_id: B96GkdgAAAAJ:RJOyoaXV5v8C
- title: 'Search Arena: Analyzing Search-Augmented LLMs'
  authors: Mihran Miroyan and Tsung-Han Wu and Logan King and Tianle Li and Jiayi
    Pan and Xinyan Hu and Wei-Lin Chiang and Anastasios N Angelopoulos and Trevor
    Darrell and Narges Norouzi and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2506.05334
  year: 2025
  citations: 8
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:Xl6nMSl579sC
  abstract: 'Search-augmented language models combine web search with Large Language
    Models (LLMs) to improve response groundedness and freshness. However, analyzing
    these systems remains challenging: existing datasets are limited in scale and
    narrow in scope, often constrained to static, single-turn, fact-checking questions.
    In this work, we introduce Search Arena, a crowd-sourced, large-scale, human-preference
    dataset of over 24,000 paired multi-turn user interactions with search-augmented
    LLMs. The dataset spans diverse intents and languages, and contains full system
    traces with around 12,000 human preference votes. Our analysis reveals that user
    preferences are influenced by the number of citations, even when the cited content
    does not directly support the attributed claims, uncovering a gap between perceived
    and actual credibility. Furthermore, user preferences vary across cited sources,
    revealing that community-driven platforms are generally preferred and static encyclopedic
    sources are not always appropriate and reliable. To assess performance across
    different settings, we conduct cross-arena analyses by testing search-augmented
    LLMs in a general-purpose chat environment and conventional LLMs in search-intensive
    settings. We find that web search does not degrade and may even improve performance
    in non-search settings; however, the quality in search settings is significantly
    affected if solely relying on the model''s parametric knowledge. We open-sourced
    the dataset to support future research in this direction. Our dataset and code
    are available at: https://github.com/lmarena/search-arena.'
  bib_id: B96GkdgAAAAJ:Xl6nMSl579sC
- title: 'SkyRL-Agent: Efficient RL Training for Multi-turn LLM Agent'
  authors: Shiyi Cao and Dacheng Li and Fangzhou Zhao and Shuo Yuan and Sumanth R
    Hegde and Connor Chen and Charlie Ruan and Tyler Griggs and Shu Liu and Eric Tang
    and Richard Liaw and Philipp Moritz and Matei Zaharia and Joseph E Gonzalez and
    Ion Stoica
  venue: arXiv preprint arXiv:2511.16108
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:D_tqNUsBuKoC
  abstract: 'We introduce SkyRL-Agent, a framework for efficient, multi-turn, long-horizon
    agent training and evaluation. It provides efficient asynchronous dispatching,
    lightweight tool integration, and flexible backend interoperability, enabling
    seamless use with existing RL frameworks such as SkyRL-train, VeRL, and Tinker.
    Using SkyRL-Agent, we train SA-SWE-32B, a software engineering agent trained from
    Qwen3-32B (24.4% Pass@1) purely with reinforcement learning. We introduce two
    key components: an optimized asynchronous pipeline dispatcher that achieves a
    1.55x speedup over naive asynchronous batching, and a tool-enhanced training recipe
    leveraging an AST-based search tool to facilitate code navigation, boost rollout
    Pass@K, and improve training efficiency. Together, these optimizations enable
    SA-SWE-32B to reach 39.4% Pass@1 on SWE-Bench Verified with more than 2x cost
    reduction compared to prior models reaching similar performance. Despite being
    trained solely on SWE tasks, SA-SWE-32B generalizes effectively to other agentic
    tasks, including Terminal-Bench, BrowseComp-Plus, and WebArena. We further demonstrate
    SkyRL-Agent''s extensibility through case studies on deep research, computer use,
    and memory agents, each trained using a different training backend.'
  bib_id: B96GkdgAAAAJ:D_tqNUsBuKoC
- title: 'The danger of overthinking: Examining the reasoning-action dilemma in agentic
    tasks'
  authors: Alejandro Cuadron and Dacheng Li and Wenjie Ma and Xingyao Wang and Yichuan
    Wang and Siyuan Zhuang and Shu Liu and Luis Gaspar Schroeder and Tian Xia and
    Huanzhi Mao and Nicholas Thumiger and Aditya Desai and Ion Stoica and Ana Klimovic
    and Graham Neubig and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2502.08235
  year: 2025
  citations: 70
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:BrOSOlqYqPUC
  abstract: 'Large Reasoning Models (LRMs) represent a breakthrough in AI problem-solving
    capabilities, but their effectiveness in interactive environments can be limited.
    This paper introduces and analyzes overthinking in LRMs. A phenomenon where models
    favor extended internal reasoning chains over environmental interaction. Through
    experiments on software engineering tasks using SWE Bench Verified, we observe
    three recurring patterns: Analysis Paralysis, Rogue Actions, and Premature Disengagement.
    We propose a framework to study these behaviors, which correlates with human expert
    assessments, and analyze 4018 trajectories. We observe that higher overthinking
    scores correlate with decreased performance, with reasoning models exhibiting
    stronger tendencies toward overthinking compared to non-reasoning models. Our
    analysis reveals that simple efforts to mitigate overthinking in agentic environments,
    such as selecting the solution with the lower overthinking score, can improve
    model performance by almost 30% while reducing computational costs by 43%. These
    results suggest that mitigating overthinking has strong practical implications.
    We suggest that by leveraging native function-calling capabilities and selective
    reinforcement learning overthinking tendencies could be mitigated. We also open-source
    our evaluation framework and dataset to facilitate research in this direction
    at https://github.com/AlexCuadron/Overthinking.'
  bib_id: B96GkdgAAAAJ:BrOSOlqYqPUC
- title: 'Continuum: Efficient and Robust Multi-Turn LLM Agent Scheduling with KV
    Cache Time-to-Live'
  authors: Hanchen Li and Qiuyang Mang and Runyuan He and Qizheng Zhang and Huanzhi
    Mao and Xiaokun Chen and Alvin Cheung and Joseph Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2511.02230
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:qE4H1tSSYIIC
  abstract: Agentic LLM applications interleave LLM generation requests with tool
    calls. These tool calls break the continuity of the workflow by creating pauses
    between LLM requests, bringing many challenges for the serving system, especially
    under multi-turn scenarios. Each pause potentially causes KV cache eviction and
    extra waiting time before entering the continuous batch for the following LLM
    request. Since these pauses happen for each call, this problem becomes increasingly
    severe as turn number grow for agentic programs. Previous works either fail to
    incorporate information from the tool call, evicting KV cache that leads to repetitive
    prefill or loading, or ignore the continuity of a multi-turn program, creating
    waiting time between turns that increases per-request latency. We present Continuum,
    a serving system to optimize job completion time for multi-turn agent workloads
    by combining tool-aware KV cache timeout with program-level scheduling. By predicting
    tool call durations in agentic workflows, Continuum selectively pins the KV cache
    in GPU memory with a time-to-live value based on total turn number. When combined
    with program-level first-come-first-serve, Continuum prevents scheduling bubbles,
    preserves multi-turn continuity, and optimizes for throughput for complex agentic
    workflows. By modeling the variability of tool call and agent program continuity,
    Continuum outperforms state-of-the-art baselines. Our evaluation on real-world
    agentic workloads (SWE-Bench and BFCL) with Llama-3.1 8B/70B models shows that
    Continuum significantly improves the average job completion times, and remains
    performant across different hardware …
  bib_id: B96GkdgAAAAJ:qE4H1tSSYIIC
- title: 'Supporting our ai overlords: Redesigning data systems to be agent-first'
  authors: Shu Liu and Soujanya Ponnapalli and Shreya Shankar and Sepanta Zeighami
    and Alan Zhu and Shubham Agarwal and Ruiqi Chen and Samion Suwito and Shuo Yuan
    and Ion Stoica and Matei Zaharia and Alvin Cheung and Natacha Crooks and Joseph
    E Gonzalez and Aditya G Parameswaran
  venue: arXiv preprint arXiv:2509.00997
  year: 2025
  citations: 5
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:eGYfIraVYiQC
  abstract: Large Language Model (LLM) agents, acting on their users' behalf to manipulate
    and analyze data, are likely to become the dominant workload for data systems
    in the future. When working with data, agents employ a high-throughput process
    of exploration and solution formulation for the given task, one we call agentic
    speculation. The sheer volume and inefficiencies of agentic speculation can pose
    challenges for present-day data systems. We argue that data systems need to adapt
    to more natively support agentic workloads. We take advantage of the characteristics
    of agentic speculation that we identify, i.e., scale, heterogeneity, redundancy,
    and steerability - to outline a number of new research opportunities for a new
    agent-first data systems architecture, ranging from new query interfaces, to new
    query processing techniques, to new agentic memory stores.
  bib_id: B96GkdgAAAAJ:eGYfIraVYiQC
- title: 'Generate, but Verify: Reducing Hallucination in Vision-Language Models with
    Retrospective Resampling'
  authors: Tsung-Han Wu and Heekyung Lee and Jiaxin Ge and Joseph E Gonzalez and Trevor
    Darrell and David M Chan
  venue: arXiv preprint arXiv:2504.13169
  year: 2025
  citations: 9
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:UuEBAcK4md4C
  abstract: 'Vision-Language Models (VLMs) excel at visual understanding but often
    suffer from visual hallucinations, where they generate descriptions of nonexistent
    objects, actions, or concepts, posing significant risks in safety-critical applications.
    Existing hallucination mitigation methods typically follow one of two paradigms:
    generation adjustment, which modifies decoding behavior to align text with visual
    inputs, and post-hoc verification, where external models assess and correct outputs.
    While effective, generation adjustment methods often rely on heuristics and lack
    correction mechanisms, while post-hoc verification is complicated, typically requiring
    multiple models and tending to reject outputs rather than refine them. In this
    work, we introduce REVERSE, a unified framework that integrates hallucination-aware
    training with on-the-fly self-verification. By leveraging a new hallucination-verification
    dataset containing over 1.3M semi-synthetic samples, along with a novel inference-time
    retrospective resampling technique, our approach enables VLMs to both detect hallucinations
    during generation and dynamically revise those hallucinations. Our evaluations
    show that REVERSE achieves state-of-the-art hallucination reduction, outperforming
    the best existing methods by up to 12% on CHAIR-MSCOCO and 34% on HaloQuest. Our
    dataset, model, and code are available at: https://reverse-vlm.github.io.'
  bib_id: B96GkdgAAAAJ:UuEBAcK4md4C
- title: Measuring Agents in Production
  authors: Melissa Z Pan and Negar Arabzadeh and Riccardo Cogo and Yuxuan Zhu and
    Alexander Xiong and Lakshya A Agrawal and Huanzhi Mao and Emma Shen and Sid Pallerla
    and Liana Patel and Shu Liu and Tianneng Shi and Xiaoyuan Liu and Jared Quincy
    Davis and Emmanuele Lacavalla and Alessandro Basile and Shuyi Yang and Paul Castro
    and Daniel Kang and Joseph E Gonzalez and Koushik Sen and Dawn Song and Ion Stoica
    and Matei Zaharia and Marquita Ellis
  venue: arXiv preprint arXiv:2512.04123
  year: 2025
  citations: 2
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:T_ojBgVMvoEC
  abstract: 'AI agents are actively running in production across diverse industries,
    yet little is publicly known about which technical approaches enable successful
    real-world deployments. We present the first large-scale systematic study of AI
    agents in production, surveying 306 practitioners and conducting 20 in-depth case
    studies via interviews across 26 domains. We investigate why organizations build
    agents, how they build them, how they evaluate them, and what the top development
    challenges are. We find that production agents are typically built using simple,
    controllable approaches: 68% execute at most 10 steps before requiring human intervention,
    70% rely on prompting off-the-shelf models instead of weight tuning, and 74% depend
    primarily on human evaluation. Reliability remains the top development challenge,
    driven by difficulties in ensuring and evaluating agent correctness. Despite these
    challenges, simple yet effective methods already enable agents to deliver impact
    across diverse industries. Our study documents the current state of practice and
    bridges the gap between research and deployment by providing researchers visibility
    into production challenges while offering practitioners proven patterns from successful
    deployments.'
  bib_id: B96GkdgAAAAJ:T_ojBgVMvoEC
- title: Adaptive Semantic Prompt Caching with VectorQ
  authors: Luis Gaspar Schroeder and Shu Liu and Alejandro Cuadron and Mark Zhao and
    Stephan Krusche and Alfons Kemper and Matei Zaharia and Joseph E Gonzalez
