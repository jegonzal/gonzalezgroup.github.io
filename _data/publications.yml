- title: 'DS SERVE: A Framework for Efficient and Scalable Neural Retrieval'
  authors: Jinjian Liu and Yichuan Wang and Xinxi Lyu and Rulin Shao and Joseph E
    Gonzalez and Matei Zaharia and Sewon Min
  venue: ''
  year: 2026
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:NxmKEeNBbOMC
  abstract: We present DS SERVE, a framework that transforms largescale text datasets—comprising
    half a trillion tokens—into a high-performance neural retrieval system. DS SERVE
    offers both a web interface and API endpoints, achieving low latency with modest
    memory overhead on a single node. The framework also supports inference-time tradeoffs
    between latency, accuracy, and result diversity. We anticipate that DS SERVE will
    be broadly useful for a range of applications such as large-scale retrieval-augmented
    generation (RAG), training data attribution, training a search agent, and beyond.
  bib_id: B96GkdgAAAAJ:NxmKEeNBbOMC
- title: 'S*: Test time scaling for code generation'
  authors: Dacheng Li and Shiyi Cao and Chengkun Cao and Xiuyu Li and Shangyin Tan
    and Kurt Keutzer and Jiarong Xing and Joseph E Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2502.14382
  year: 2025
  citations: 40
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:eO3_k5sD8BwC
  abstract: 'Increasing test-time compute for LLMs shows promise across domains but
    remains underexplored in code generation, despite extensive study in math. In
    this paper, we propose S*, the first hybrid test-time scaling framework that substantially
    improves the coverage and selection accuracy of generated code. S* extends the
    existing parallel scaling paradigm with sequential scaling to push performance
    boundaries. It further leverages a novel selection mechanism that adaptively generates
    distinguishing inputs for pairwise comparison, combined with execution-grounded
    information to robustly identify correct solutions. We evaluate across 12 Large
    Language Models and Large Reasoning Model and show: (1) S* consistently improves
    performance across model families and sizes, enabling a 3B model to outperform
    GPT-4o-mini; (2) S* enables non-reasoning models to surpass reasoning models -
    GPT-4o-mini with S* outperforms o1-preview by 3.7% on LiveCodeBench; (3) S* further
    boosts state-of-the-art reasoning models - DeepSeek-R1-Distill-Qwen-32B with S*
    achieves 85.7% on LiveCodeBench, approaching o1 (high) at 88.5%. Code will be
    available under https://github.com/NovaSky-AI/SkyThought.'
  bib_id: B96GkdgAAAAJ:eO3_k5sD8BwC
- title: 'RedunCut: Measurement-Driven Sampling and Accuracy Performance Modeling
    for Low-Cost Live Video Analytics'
  authors: Gur-Eyal Sela and Kumar Krishna Agrawal and Bharathan Balaji and Joseph
    Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2512.24386
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:zwpXiJ37cpgC
  abstract: 'Live video analytics (LVA) runs continuously across massive camera fleets,
    but inference cost with modern vision models remains high. To address this, dynamic
    model size selection (DMSS) is an attractive approach: it is content-aware but
    treats models as black boxes, and could potentially reduce cost by up to 10x without
    model retraining or modification. Without ground truth labels at runtime, we observe
    that DMSS methods use two stages per segment: (i) sampling a few models to calculate
    prediction statistics (e.g., confidences), then (ii) selection of the model size
    from those statistics. Prior systems fail to generalize to diverse workloads,
    particularly to mobile videos and lower accuracy targets. We identify that the
    failure modes stem from inefficient sampling whose cost exceeds its benefit, and
    inaccurate per-segment accuracy prediction. In this work, we present RedunCut,
    a new DMSS system that addresses both: It uses a measurement-driven planner that
    estimates the cost-benefit tradeoff of sampling, and a lightweight, data-driven
    performance model to improve accuracy prediction. Across road-vehicle, drone,
    and surveillance videos and multiple model families and tasks, RedunCut reduces
    compute cost by 14-62% at fixed accuracy and remains robust to limited historical
    data and to drift.'
  bib_id: B96GkdgAAAAJ:zwpXiJ37cpgC
- title: 'BARE: Leveraging Base Language Models for Few-Shot Synthetic Data Generation'
  authors: Alan Zhu and Parth Asawa and Jared Quincy Davis and Lingjiao Chen and Boris
    Hanin and Ion Stoica and Joseph E Gonzalez and Matei Zaharia
  venue: arXiv preprint arXiv:2502.01697
  year: 2025
  citations: 4
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:qe6vwMD2xtsC
  abstract: 'As the demand for high-quality data in model training grows, researchers
    and developers are increasingly generating synthetic data to tune and train LLMs.
    However, current data generation methods rely on seed sets containing tens of
    thousands of examples to prompt instruction-tuned models. This reliance can be
    especially problematic when the curation of high-quality examples is expensive
    or difficult. In this paper we explore the novel few-shot synthetic data generation
    setting -- generating a high-quality dataset from a few examples. We show that
    when working with only a few seed examples, instruction-tuned models used in current
    synthetic data methods produce insufficient diversity for downstream tasks. In
    contrast, we show that base models without post-training, largely untapped for
    synthetic data generation, offer substantially greater output diversity, albeit
    with lower instruction following abilities. Leveraging this insight, we propose
    Base-Refine (BARE), a novel two-stage method that combines the diversity of base
    models with the quality assurance of instruction-tuned models. BARE excels in
    few-shot synthetic data generation: using only 3 seed examples it generates diverse,
    high-quality datasets that significantly improve downstream task performance.
    We show that fine-tuning Llama 3.1 8B with 1,000 BARE-generated samples achieves
    performance comparable to state-of-the-art similarly sized models on LiveCodeBench
    tasks. Furthermore, data generated with BARE enables a 101% improvement for a
    fine-tuned Llama 3.2 1B on GSM8K over data generated by only instruction-models,
    and an 18.4% improvement for a fine-tuned …'
