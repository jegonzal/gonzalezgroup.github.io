  abstract: Semantic prompt caches reduce the latency and cost of large language model
    (LLM) inference by reusing cached LLM-generated responses for semantically similar
    prompts. Vector similarity metrics assign a numerical score to quantify the similarity
    between an embedded prompt and its nearest neighbor in the cache. Existing systems
    rely on a static threshold to classify whether the similarity score is sufficiently
    high to result in a cache hit. We show that this one-size-fits-all threshold is
    insufficient across different embeddings. We propose VectorQ, an online framework
    with a threshold convergence guarantee to learn embedding-specific threshold regions
    that adapt to the uncertainty of an embedding. Through evaluations on a combination
    of three diverse datasets, we show that VectorQ consistently outperforms state-of-the-art
    systems across all static thresholds, achieving up to 26x increases in cache hit
    rate and …
  bib_id: B96GkdgAAAAJ:ziOE8S1-AIUC
- title: Are Large Reasoning Models Interruptible?
  authors: Tsung-Han Wu and Mihran Miroyan and David M Chan and Trevor Darrell and
    Narges Norouzi and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2510.11713
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:C33y2ycGS3YC
  abstract: 'Large Reasoning Models (LRMs) excel at complex reasoning but are traditionally
    evaluated in static, "frozen world" settings: model responses are assumed to be
    instantaneous, and the context of a request is presumed to be immutable over the
    duration of the response. While generally true for short-term tasks, the "frozen
    world" assumption breaks down in modern reasoning tasks such as assistive programming,
    where models may take hours to think through problems and code may change dramatically
    from the time the model starts thinking to the model''s final output. In this
    work, we challenge the frozen world assumption and evaluate LRM robustness under
    two realistic dynamic scenarios: interruptions, which test the quality of the
    model''s partial outputs on a limited budget, and dynamic context, which tests
    model adaptation to in-flight changes. Across mathematics and programming benchmarks
    that require long-form reasoning, static evaluations consistently overestimate
    robustness: even state-of-the-art LRMs, which achieve high accuracy in static
    settings, can fail unpredictably when interrupted or exposed to changing context,
    with performance dropping by up to 60% when updates are introduced late in the
    reasoning process. Our analysis further reveals several novel failure modes, including
    reasoning leakage, where models fold the reasoning into their final answer when
    interrupted; panic, where under time pressure models abandon reasoning entirely
    and return incorrect answers; and self-doubt, where performance degrades while
    incorporating updated information. Project Page: http://dynamic-lm.github.io/'
  bib_id: B96GkdgAAAAJ:C33y2ycGS3YC
- title: Discovering Divergent Representations between Text-to-Image Models
  authors: Lisa Dunlap and Joseph E Gonzalez and Trevor Darrell and Fabian Caba Heilbron
    and Josef Sivic and Bryan Russell
  venue: Proceedings of the IEEE/CVF International Conference on Computer Vision
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:0aBXIfxlw9sC
  abstract: In this paper, we investigate when and how visual representations learned
    by two different generative models diverge from each other. Specifically, given
    two text-to-image models, our goal is to discover visual attributes that appear
    in images generated by one model but not the other, along with the types of prompts
    that trigger these attribute differences. For example,'flames' might appear in
    one model's outputs when given prompts expressing strong emotions, while the other
    model does not produce this attribute given the same prompts. We introduce CompCon
    (Comparing Concepts), an evolutionary search algorithm that discovers visual attributes
    more prevalent in one model's output than the other, and uncovers the prompt concepts
    linked to these visual differences. To evaluate CompCon's ability to find diverging
    representations, we create an automated data generation pipeline to produce ID^
    2, a dataset of 60 input-dependent differences, and compare our approach to several
    LLM-and VLM-powered baselines. Finally, we use CompCon to compare popular text-to-image
    models, finding divergent representations such as how PixArt depicts prompts mentioning
    loneliness with wet streets and Stable Diffusion 3.5 depicts African American
    people in media professions.
  bib_id: B96GkdgAAAAJ:0aBXIfxlw9sC
- title: Locality-aware Fair Scheduling in LLM Serving
  authors: Shiyi Cao and Yichuan Wang and Ziming Mao and Pin-Lun Hsu and Liangsheng
    Yin and Tian Xia and Dacheng Li and Shu Liu and Yineng Zhang and Yang Zhou and
    Ying Sheng and Joseph Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2501.14312
  year: 2025
  citations: 8
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:YsrPvlHIBpEC
  abstract: Large language model (LLM) inference workload dominates a wide variety
    of modern AI applications, ranging from multi-turn conversation to document analysis.
    Balancing fairness and efficiency is critical for managing diverse client workloads
    with varying prefix patterns. Unfortunately, existing fair scheduling algorithms
    for LLM serving, such as Virtual Token Counter (VTC), fail to take prefix locality
    into consideration and thus suffer from poor performance. On the other hand, locality-aware
    scheduling algorithms in existing LLM serving frameworks tend to maximize the
    prefix cache hit rate without considering fair sharing among clients. This paper
    introduces the first locality-aware fair scheduling algorithm, Deficit Longest
    Prefix Match (DLPM), which can maintain a high degree of prefix locality with
    a fairness guarantee. We also introduce a novel algorithm, Double Deficit LPM
    (DLPM), extending DLPM for the distributed setup that can find a balance point
    among fairness, locality, and load-balancing. Our extensive evaluation demonstrates
    the superior performance of DLPM and DLPM in ensuring fairness while maintaining
    high throughput (up to 2.87 higher than VTC) and low per-client (up to 7.18 lower
    than state-of-the-art distributed LLM serving system) latency.
  bib_id: B96GkdgAAAAJ:YsrPvlHIBpEC
- title: 'How to train your advisor: Steering black-box llms with advisor models'
  authors: Parth Asawa and Alan Zhu and Matei Zaharia and Alexandros G Dimakis and
    Joseph E Gonzalez
  venue: arXiv preprint arXiv:2510.02453
  year: 2025
  citations: 2
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:isU91gLudPYC
  abstract: Foundation models are increasingly deployed as black-box services, where
    model weights cannot be modified and customization is limited to prompting. While
    static prompt optimization has shown promise, it produces a single fixed prompt
    that fails to adapt to different inputs, users, or environments. We introduce
    Advisor Models, lightweight parametric policies trained with reinforcement learning
    to reactively issue natural language steering instructions in-context to black-box
    models. The advisor is a second small model that sits between the input and the
    model, shaping behavior on a per-instance basis using reward signals from the
    environment. Across multiple domains involving reasoning and personalization,
    we show that Advisor Models outperform static prompt optimizers, discovering environment
    dynamics and improving downstream task performance. We also demonstrate the generalizability
    of advisors by transferring them across black-box models, as well as the framework's
    ability to achieve specialization while retaining robustness to out-of-distribution
    inputs. Viewed more broadly, Advisor Models provide a learnable interface to black-box
    systems where the advisor acts as a parametric, environment-specific memory. We
    argue that dynamic optimization of black-box models via Advisor Models is a promising
    direction for enabling personalization and environment-adaptable AI with frontier-level
    capabilities.
  bib_id: B96GkdgAAAAJ:isU91gLudPYC
- title: Why do multiagent systems fail?
  authors: Melissa Z Pan and Mert Cemri and Lakshya A Agrawal and Shuyi Yang and Bhavya
    Chopra and Rishabh Tiwari and Kurt Keutzer and Aditya Parameswaran and Kannan
    Ramchandran and Dan Klein and Joseph E Gonzalez and Matei Zaharia and Ion Stoica
  venue: ICLR 2025 Workshop on Building Trust in Language Models and Applications
  year: 2025
  citations: 39
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:mWEH9CqjF64C
  abstract: 'Despite growing enthusiasm for Multi-Agent Systems (MAS), where multiple
    LLM agents collaborate to accomplish tasks, their performance gains across popular
    benchmarks remain minimal compared to single-agent frameworks. This gap highlights
    the need to analyze the challenges hindering MAS effectiveness. In this paper
    we conduct the first comprehensive study of challenges of MAS across 5 popular
    Multi-Agent Systems over 150+ tasks. We conduct an investigation with four expert
    human annotators studying the MAS execution traces, identifying 18 fine-grained
    failure modes, and propose a comprehensive failure taxonomy applicable across
    systems. We group these fine-grained failure modes into four key categories: (i)
    specification ambiguities and misalignment, (ii) organizational breakdowns, (iii)
    inter-agent conflict and coordination gaps, and (iv) weak verification and quality
    control.  To understand whether these failure modes could have easily been avoided,
    we propose two interventions: improved agents roles specification and orchestration
    strategies. We find that identified failures require more involved solutions and
    we outline a roadmap for future research in this space. To contribute towards
    better development of MAS, we will open source our dataset, including the agent
    conversation traces and human annotations.'
  bib_id: B96GkdgAAAAJ:mWEH9CqjF64C
- title: Optimizing llm queries in relational data analytics workloads
  authors: Shu Liu and Asim Biswal and Amog Kamsetty and Audrey Cheng and Luis G Schroeder
    and Liana Patel and Shiyi Cao and Xiangxi Mo and Ion Stoica and Joseph E Gonzalez
    and Matei Zaharia
  venue: Proceedings of Machine Learning and Systems
  year: 2025
  citations: 9
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:LXmCCkuhhTsC
  abstract: 'Batch data analytics is a growing application for Large Language Models
    (LLMs). LLMs enable users to perform a wide range of natural language tasks, such
    as classification, entity extraction, and translation, over large datasets. However,
    LLM inference is highly costly and slow: for example, an NVIDIA L4 GPU running
    Llama3-8B can only process 6 KB of text per second, taking about a month to handle
    15 GB of data; processing a similar amount of data costs around $18 K on OpenAI’s
    GPT-4o. In this paper, we propose novel techniques that can significantly reduce
    the cost of LLM calls for relational data analytics workloads. Our key contribution
    is developing efficient algorithms for reordering the rows and the fields within
    each row of an input table to maximize key-value (KV) cache reuse when performing
    LLM serving. As such, our approach can be easily applied to existing analytics
    systems and serving platforms. Our evaluation shows that our solution can yield
    up to 3.4× improvement in job completion time on a benchmark of diverse LLM-based
    queries using Llama 3 models. Our solution also achieves a 32% cost savings under
    OpenAI and Anthropic pricing models.'
  bib_id: B96GkdgAAAAJ:LXmCCkuhhTsC
- title: Bandwidth Allocation for Cloud-Augmented Autonomous Driving
  authors: Peter Schafhalter and Alexander Krentsel and Joseph E Gonzalez and Sylvia
    Ratnasamy and Scott Shenker and Ion Stoica
  venue: arXiv preprint arXiv:2503.20127
  year: 2025
  citations: 2
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:HJSXoJQnj-YC
  abstract: 'Autonomous vehicle (AV) control systems increasingly rely on ML models
    for tasks such as perception and planning. Current practice is to run these models
    on the car''s local hardware due to real-time latency constraints and reliability
    concerns, which limits model size and thus accuracy. Prior work has observed that
    we could augment current systems by running larger models in the cloud, relying
    on faster cloud runtimes to offset the cellular network latency. However, prior
    work does not account for an important practical constraint: limited cellular
    bandwidth. We show that, for typical bandwidth levels, proposed techniques for
    cloud-augmented AV models take too long to transfer data, thus mostly falling
    back to the on-car models and resulting in no accuracy improvement. In this work,
    we show that realizing cloud-augmented AV models requires intelligent use of this
    scarce bandwidth, i.e. carefully allocating bandwidth across tasks and providing
    multiple data compression and model options. We formulate this as a resource allocation
    problem to maximize car utility, and present our system \sysname which achieves
    an increase in average model accuracy by up to 15 percentage points on driving
    scenarios from the Waymo Open Dataset.'
  bib_id: B96GkdgAAAAJ:HJSXoJQnj-YC
- title: 'vcache: Verified semantic prompt caching'
  authors: Luis Gaspar Schroeder and Aditya Desai and Alejandro Cuadron and Kyle Chu
    and Shu Liu and Mark Zhao and Stephan Krusche and Alfons Kemper and Ion Stoica
    and Matei Zaharia and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2502.03771
  year: 2025
  citations: 4
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:8Xgff_V0N9gC
  abstract: Semantic caches return cached responses for semantically similar prompts
    to reduce LLM inference latency and cost. They embed cached prompts and store
    them alongside their response in a vector database. Embedding similarity metrics
    assign a numerical score to quantify the similarity between a request and its
    nearest neighbor prompt from the cache. Existing systems use the same static similarity
    threshold across all requests to determine whether two prompts can share similar
    responses. However, we observe that static thresholds do not give formal correctness
    guarantees, can result in unexpected error rates, and lead to suboptimal cache
    hit rates. This paper proposes vCache, the first verified semantic cache with
    user-defined error rate guarantees. It employs an online learning algorithm to
    estimate an optimal threshold for each cached prompt, enabling reliable cache
    responses without additional training. Our experiments show that vCache consistently
    meets the specified error bounds while outperforming state-of-the-art static-threshold
    and fine-tuned embedding baselines. We release the vCache implementation and three
    benchmarks to support future research.
  bib_id: B96GkdgAAAAJ:8Xgff_V0N9gC
- title: 'Sleep-time compute: Beyond inference scaling at test-time'
  authors: Kevin Lin and Charlie Snell and Yu Wang and Charles Packer and Sarah Wooders
    and Ion Stoica and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2504.13171
  year: 2025
  citations: 13
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:rbm3iO8VlycC
  abstract: 'Scaling test-time compute has emerged as a key ingredient for enabling
    large language models (LLMs) to solve difficult problems, but comes with high
    latency and inference cost. We introduce sleep-time compute, which allows models
    to "think" offline about contexts before queries are presented: by anticipating
    what queries users might ask and pre-computing useful quantities, we can significantly
    reduce the compute requirements at test-time. To demonstrate the efficacy of our
    method, we create modified versions of two reasoning tasks - Stateful GSM-Symbolic
    and Stateful AIME. We find that sleep-time compute can reduce the amount of test-time
    compute needed to achieve the same accuracy by ~ 5x on Stateful GSM-Symbolic and
    Stateful AIME and that by scaling sleep-time compute we can further increase accuracy
    by up to 13% on Stateful GSM-Symbolic and 18% on Stateful AIME. Furthermore, we
    introduce Multi-Query GSM-Symbolic, which extends GSM-Symbolic by including multiple
    related queries per context. By amortizing sleep-time compute across related queries
    about the same context using Multi-Query GSM-Symbolic, we can decrease the average
    cost per query by 2.5x. We then conduct additional analysis to understand when
    sleep-time compute is most effective, finding the predictability of the user query
    to be well correlated with the efficacy of sleep-time compute. Finally, we conduct
    a case-study of applying sleep-time compute to a realistic agentic SWE task.'
  bib_id: B96GkdgAAAAJ:rbm3iO8VlycC
- title: 'Visionarena: 230k real world user-vlm conversations with preference labels'
  authors: Christopher Chou and Lisa Dunlap and Koki Mashita and Krishna Mandal and
    Trevor Darrell and Ion Stoica and Joseph E Gonzalez and Wei-Lin Chiang
  venue: Proceedings of the Computer Vision and Pattern Recognition Conference
  year: 2025
  citations: 11
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:sszUF3NjhM4C
  abstract: The growing adoption and capabilities of vision-language models (VLMs)
    demand benchmarks that reflect real-world user interactions. We introduce VisionArena,
    the largest existing dataset of crowdsourced real-world conversations between
    users and VLMs. While most visual question-answering datasets focus on close-ended
    problems or synthetic scenarios, VisionArena contains a wide variety of closed
    and open ended problems across 230K conversations, 73K unique users, 138 languages,
    and 45 VLMs. VisionArena consists of VisionArena-Chat, a set of 200k single-turn
    and multi-turn chat logs with a VLM, VisionArena-Battle, a set of 30K conversations
    between a user and 2 anonymous VLMs with preference votes, and VisionArena-Bench,
    an automatic benchmark consisting of 500 diverse user prompts which can be used
    to cheaply approximate model rankings. We analyze these datasets and highlight
    the types of question asked by users, the influence of style on user preference,
    and areas where models often fall short. We find that more open-ended questions
    like captioning and humor are heavily influenced by style, which causes certain
    models like Reka Flash and InternVL which are tuned for style to perform significantly
    better on these categories compared to other categories. We show that VisionArena-Chat
    and VisionArena-Battle can be used for post-training to align VLMs to human preferences
    through supervised fine-tuning. Compared to the popular instruction tuning dataset
    Llava-Instruct-158K, finetuning the same base model on VisionArena results in
    aa 17 point improvement on MMMU and a 46 point improvement on the …
  bib_id: B96GkdgAAAAJ:sszUF3NjhM4C
- title: 'ParaStudent: Generating and Evaluating Realistic Student Code by Teaching
    LLMs to Struggle'
  authors: Mihran Miroyan and Rose Niousha and Joseph E Gonzalez and Gireeja Ranade
    and Narges Norouzi
  venue: arXiv preprint arXiv:2507.12674
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:2v_ZtQDX9iAC
  abstract: Large Language Models (LLMs) have shown strong performance on programming
    tasks, but can they generate student-like code like real students - imperfect,
    iterative, and stylistically diverse? We present ParaStudent, a systematic study
    of LLM-based "student-like" code generation in an introductory programming course
    setting. Using a dataset of timestamped student submissions across multiple semesters,
    we design low- and high-resolution experiments to model student progress and evaluate
    code outputs along semantic, functional, and stylistic dimensions. Our results
    show that fine-tuning significantly improves alignment with real student trajectories
    and captures error patterns, incremental improvements, and stylistic variations
    more faithfully. This study shows that modeling realistic student code requires
    capturing learning dynamics through context-aware generation, temporal modeling,
    and multi-dimensional evaluation. Code for experiments and evaluation is available
    at https://github.com/mmiroyan/ParaStudent.
  bib_id: B96GkdgAAAAJ:2v_ZtQDX9iAC
- title: 'Useful Agentic AI: A Systems Outlook'
  authors: Melissa Pan𝛽 and Yuxuan Zhu and Jared Quincy Davis𝜎 and Riccardo Cogo and
    Lakshya A Agrawal and Negar Arabzadeh and Xiaoyuan Liu and Huanzhi Mao and Sid
    Pallerla and Tianneng Shi and Alexander Xiong and Alessandro Basile and Emmanuele
    Lacavalla and Shuyi Yang and Diana Arroyo and Paul Castro and Daniel Kang and
    Joseph Gonzalez and Koushik Sen and Dawn Song and Ion Stoica and Matei Zaharia𝛽
    and Marquita Ellis
  venue: ''
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:tHtfpZlB6tUC
  abstract: To effectively meet and anticipate the requirements of practically impactful
    (useful) Agentic AI systems, including but not limited to new metrics, benchmarks,
    programming and runtime systems, it is necessary to first understand the use-cases
    and state of progress (or lack thereof). We present our perspective from practitioner
    interviews and questionnaire responses, critically supplementing the wider body
    of published data (papers, blogs, OSS). We aggregated and distilled this data
    for 10+ cases spanning enterprise, software, and scientific domains, with several
    more in progress. Our aim is to bridge this academic-industry divide, steering
    our own and other’s systems research toward the most impactful problems. Though
    Agentic AI innovations are rapidly proliferating across academia and industry,
    the requirements and key challenges between academic and enterprise settings differ
    significantly. Academic literature is currently skewed toward pushing capabilities
    of LLM-based agents and Artificial General Intelligence. Industry use-cases rely
    on data and models of multiple modalities, focus on specific enterprise-grade
    versus general functionality, and cannot ignore latencies, cost, scalability,
    security, and many other practical deployment concerns. We find, while not yet
    useful for all tasks, Agentic AI systems are becoming increasingly useful for
    facilitating, augmenting, and/or accelerating scoped manual and software tasks.
    Our principle findings is that Useful Agentic AI systems currently rely on a combination
    of human and machine verifiers, with the most sophisticated (autonomous) systems
    supported by strong verifiers from mathematics …
  bib_id: B96GkdgAAAAJ:tHtfpZlB6tUC
- title: 'Autellix: An efficient serving engine for llm agents as general programs'
  authors: Michael Luo and Xiaoxiang Shi and Colin Cai and Tianjun Zhang and Justin
    Wong and Yichuan Wang and Chi Wang and Yanping Huang and Zhifeng Chen and Joseph
    E Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2502.13965
  year: 2025
  citations: 11
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:DkZNVXde3BIC
  abstract: Large language model (LLM) applications are evolving beyond simple chatbots
    into dynamic, general-purpose agentic programs, which scale LLM calls and output
    tokens to help AI agents reason, explore, and solve complex tasks. However, existing
    LLM serving systems ignore dependencies between programs and calls, missing significant
    opportunities for optimization. Our analysis reveals that programs submitted to
    LLM serving engines experience long cumulative wait times, primarily due to head-of-line
    blocking at both the individual LLM request and the program. To address this,
    we introduce Autellix, an LLM serving system that treats programs as first-class
    citizens to minimize their end-to-end latencies. Autellix intercepts LLM calls
    submitted by programs, enriching schedulers with program-level context. We propose
    two scheduling algorithms-for single-threaded and distributed programs-that preempt
    and prioritize LLM calls based on their programs' previously completed calls.
    Our evaluation demonstrates that across diverse LLMs and agentic workloads, Autellix
    improves throughput of programs by 4-15x at the same latency compared to state-of-the-art
    systems, such as vLLM.
  bib_id: B96GkdgAAAAJ:DkZNVXde3BIC
- title: 'LEANN: A Low-Storage Vector Index'
  authors: Yichuan Wang and Zhifei Li and Shu Liu and Yongji Wu and Ziming Mao and
    Yilong Zhao and Xiao Yan and Zhiying Xu and Yang Zhou and Ion Stoica and Sewon
    Min and Matei Zaharia and Joseph E Gonzalez
  venue: arXiv preprint arXiv:2506.08276
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:aIdbFUkbNIkC
  abstract: Embedding-based vector search underpins many important applications, such
    as recommendation and retrieval-augmented generation (RAG). It relies on vector
    indices to enable efficient search. However, these indices require storing high-dimensional
    embeddings and large index metadata, whose total size can be several times larger
    than the original data (e.g., text chunks). Such high storage overhead makes it
    difficult, or even impractical, to deploy vector search on personal devices or
    large-scale datasets. To tackle this problem, we propose LEANN, a storage-efficient
    index for vector search that recomputes embeddings on the fly instead of storing
    them, and compresses state-of-the-art proximity graph indices while preserving
    search accuracy. LEANN delivers high-quality vector search while using only a
    fraction of the storage (e.g., 5% of the original data) and supporting storage-efficient
    index construction and updates. On real-world benchmarks, LEANN reduces index
    size by up to 50x compared with conventional indices, while maintaining SOTA accuracy
    and comparable latency for RAG applications.
  bib_id: B96GkdgAAAAJ:aIdbFUkbNIkC
- title: 'Extending Delayed Fair Sharing: A Generalizable Framework for Multi-Resource
    Performance Isolation'
  authors: James DeLoye and Tyler Griggs and Dev Bali and Wenjie Ma and Audrey Cheng
    and Jae Hong and Soujanya Ponnapalli and Natacha Crooks and Scott Shenker and
    Ion Stoica and Matei Zaharia and Joseph Gonzalez
  venue: ''
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:QsaTk4IG4EwC
  abstract: Modern storage systems, often deployed to support multiple tenants, must
    provide performance isolation. Traditional approaches, like fair sharing resources,
    work poorly for these systems as storage resources exhibit high preemption delays.
    These delays force clients to wait to receive their share of resources, and lead
    to unacceptable spikes in tail latency.Delayed Fair Sharing is a new fairness
    de nition that explicitly bounds the delay a client incurs to receive its fair
    share of resources. DFS originally proposed policies that bound the preemption
    delays of commonly contended storage resources, such as write bu ers, and read
    caches and implemented them in F DB, an extension of RocksDB. In this work we
    attempt to extend Delayed Fair Sharing to other candidate resources, speci cally
    the RocksDB write-ahead log (WAL) and ush threadpool, and implement these extensions
    in F DB and evaluate their e ectiveness.
  bib_id: B96GkdgAAAAJ:QsaTk4IG4EwC
- title: 'MoE-Lightning: High-Throughput MoE Inference on Memory-constrained GPUs'
  authors: Shiyi Cao and Shu Liu and Tyler Griggs and Peter Schafhalter and Xiaoxuan
    Liu and Ying Sheng and Joseph E Gonzalez and Matei Zaharia and Ion Stoica
  venue: ''
  year: 2025
  citations: 47
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:HGTzPopzzJcC
  abstract: Efficient deployment of large language models, particularly Mixture of
    Experts (MoE) models, on resource-constrained platforms presents significant challenges
    in terms of computational efficiency and memory utilization. The MoE architecture,
    renowned for its ability to increase model capacity without a proportional increase
    in inference cost, greatly reduces the token generation latency compared with
    dense models. However, the large model size makes MoE models inaccessible to individuals
