- title: Towards efficient and practical gpu multitasking in the era of llm
  authors: Jiarong Xing and Yifan Qiao and Simon Mo and Xingqi Cui and Gur-Eyal Sela
    and Yang Zhou and Joseph Gonzalez and Ion Stoica
  venue: arXiv preprint arXiv:2508.08448
  year: 2025
  citations: 3
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:X9ykpCP0fEIC
  abstract: GPU singletasking is becoming increasingly inefficient and unsustainable
    as hardware capabilities grow and workloads diversify. We are now at an inflection
    point where GPUs must embrace multitasking, much like CPUs did decades ago, to
    meet the demands of modern AI workloads. In this work, we highlight the key requirements
    for GPU multitasking, examine prior efforts, and discuss why they fall short.
    To advance toward efficient and practical GPU multitasking, we envision a resource
    management layer, analogous to a CPU operating system, to handle various aspects
    of GPU resource management and sharing. We outline the challenges and potential
    solutions, and hope this paper inspires broader community efforts to build the
    next-generation GPU compute paradigm grounded in multitasking.
