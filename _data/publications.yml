  abstract: 'State-of-the-art sparse attention methods for reducing decoding latency
    fall into two main categories: approximate top- (and its extension, top-) and
    recently introduced sampling-based estimation. However, these approaches are fundamentally
    limited in their ability to approximate full attention: they fail to provide consistent
    approximations across heads and query vectors and, most critically, lack guarantees
    on approximation quality, limiting their practical deployment. We observe that
    top- and random sampling are complementary: top- performs well when attention
    scores are dominated by a few tokens, whereas random sampling provides better
    estimates when attention scores are relatively uniform. Building on this insight
    and leveraging the statistical guarantees of sampling, we introduce vAttention,
    the first practical sparse attention mechanism with user-specified  guarantees
    on approximation accuracy (thus, verified). These guarantees make vAttention a
    compelling step toward practical, reliable deployment of sparse attention at scale.
    By unifying top-k and sampling, vAttention outperforms both individually, delivering
    a superior quality-efficiency trade-off. Our experiments show that vAttention
    significantly improves the quality of sparse attention (e.g., 4.5 percentage points
    for Llama-3.1-8B-Inst and Deepseek-R1-Distill-Llama-8B on RULER-HARD), and effectively
    bridges the gap between full and sparse attention (e.g., across datasets, it matches
    full model quality with upto 20x sparsity). We also demonstrate that it can be
    deployed in reasoning scenarios to achieve fast decoding without compromising
    model quality (e.g., vAttention …'
