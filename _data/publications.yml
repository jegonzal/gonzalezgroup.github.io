- title: Language Models Can Easily Learn to Reason from Demonstrations
  authors: Dacheng Li and Shiyi Cao and Tyler Griggs and Shu Liu and Xiangxi Mo and
    Eric Tang and Sumanth Hegde and Kourosh Hakhamaneshi and Shishir G Patil and Matei
    Zaharia and Joseph E Gonzalez and Ion Stoica
  venue: 'Findings of the Association for Computational Linguistics: EMNLP 2025'
  year: 2025
  citations: 0
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:Wq2b2clWBLsC
  abstract: Large reasoning models (LRMs) tackle complex problems by following long
    chain-ofthoughts (Long CoT) that incorporate reflection, backtracking, and self-validation.
    However, the training techniques and data requirements to elicit Long CoT remain
    poorly understood. In this work, we find that language models can effectively
    learn Long CoT reasoning through data-efficient supervised finetuning (SFT) and
    further parameter-efficient low-rank adaptation (LoRA). Crucially, we find that
    the structure of Long CoT is critical to the learning process in this data-efficient
    fine-tuning process. Training on contentincorrect examples, eg those lead to incorrect
    answers or corrupted digits, still leads to significant performance gains. In
    contrast, training on structurally incorrect examples, eg, with shuffled or deleted
    reasoning steps, yield smaller improvements or even degrade performance. The model,
    Sky-T1, and codes are available at https://github. com/NovaSky-AI/SkyThought.
