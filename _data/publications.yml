- title: 'SkyStore: Cost-Optimized Object Storage Across Regions and Clouds'
  authors: Shu Liu and Xiangxi Mo and Moshik Hershcovitch and Henric Zhang and Audrey
    Cheng and Guy Girmonsky and Gil Vernik and Michael Factor and Tiemo Bang and Soujanya
    Ponnapalli and Natacha Crooks and Joseph E Gonzalez and Danny Harnik and Ion Stoica
  venue: arXiv preprint arXiv:2502.20818
  year: 2025
  citations: 2
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:DrR-2ekChdkC
  abstract: 'Modern applications span multiple clouds to reduce costs, avoid vendor
    lock-in, and leverage low-availability resources in another cloud. However, standard
    object stores operate within a single cloud, forcing users to manually manage
    data placement across clouds, i.e., navigate their diverse APIs and handle heterogeneous
    costs for network and storage. This is often a complex choice: users must either
    pay to store objects in a remote cloud, or pay to transfer them over the network
    based on application access patterns and cloud provider cost offerings. To address
    this, we present SkyStore, a unified object store that addresses cost-optimal
    data management across regions and clouds. SkyStore introduces a virtual object
    and bucket API to hide the complexity of interacting with multiple clouds. At
    its core, SkyStore has a novel TTL-based data placement policy that dynamically
    replicates and evicts objects according to application access patterns while optimizing
    for lower cost. Our evaluation shows that across various workloads, SkyStore reduces
    the overall cost by up to 6x over academic baselines and commercial alternatives
    like AWS multi-region buckets. SkyStore also has comparable latency, and its availability
    and fault tolerance are on par with standard cloud offerings. We release the data
    and code of SkyStore at https://github.com/skyplane-project/skystore.'
  bib_id: B96GkdgAAAAJ:DrR-2ekChdkC
- title: 'Worldmodelbench: Judging video generation models as world models'
  authors: Dacheng Li and Yunhao Fang and Yukang Chen and Shuo Yang and Shiyi Cao
    and Justin Wong and Michael Luo and Xiaolong Wang and Hongxu Yin and Joseph E
    Gonzalez and Ion Stoica and Song Han and Yao Lu
  venue: arXiv preprint arXiv:2502.20694
  year: 2025
  citations: 26
  url: https://scholar.google.com/citations?view_op=view_citation&citation_for_view=B96GkdgAAAAJ:rTD5ala9j4wC
  abstract: 'Video generation models have rapidly progressed, positioning themselves
    as video world models capable of supporting decision-making applications like
    robotics and autonomous driving. However, current benchmarks fail to rigorously
    evaluate these claims, focusing only on general video quality, ignoring important
    factors to world models such as physics adherence. To bridge this gap, we propose
    WorldModelBench, a benchmark designed to evaluate the world modeling capabilities
    of video generation models in application-driven domains. WorldModelBench offers
    two key advantages: (1) Against to nuanced world modeling violations: By incorporating
    instruction-following and physics-adherence dimensions, WorldModelBench detects
    subtle violations, such as irregular changes in object size that breach the mass
    conservation law - issues overlooked by prior benchmarks. (2) Aligned with large-scale
    human preferences: We crowd-source 67K human labels to accurately measure 14 frontier
    models. Using our high-quality human labels, we further fine-tune an accurate
    judger to automate the evaluation procedure, achieving 8.6% higher average accuracy
    in predicting world modeling violations than GPT-4o with 2B parameters. In addition,
    we demonstrate that training to align human annotations by maximizing the rewards
    from the judger noticeably improve the world modeling capability. The website
    is available at https://worldmodelbench-team.github.io.'
