  - id: north-star
    title: "A North Star for AI Research in the Era of AGI and Frontier Labs"
    description: "How academic research can choose directions while frontier labs rapidly advance general-purpose models, guided by the question of what new problems today's solutions will create, with examples from my group's work on systems for AI agents."
